name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run .NET tests
        run: dotnet test tests/Jellyfin.Plugin.CsfdBadge.Tests/Jellyfin.Plugin.CsfdBadge.Tests.csproj --configuration Release

      - name: Verify .NET formatting
        run: dotnet format tests/Jellyfin.Plugin.CsfdBadge.Tests/Jellyfin.Plugin.CsfdBadge.Tests.csproj --verify-no-changes --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install web test dependencies
        run: npm ci
        working-directory: tests/web

      - name: Run web tests
        run: npm test
        working-directory: tests/web

      - name: Check injected JavaScript syntax
        run: node --check src/Jellyfin.Plugin.CsfdBadge/Web/csfd-badge.js

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build.ps1
