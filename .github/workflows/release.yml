name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run .NET tests
        run: dotnet test tests/Jellyfin.Plugin.CsfdBadge.Tests/Jellyfin.Plugin.CsfdBadge.Tests.csproj --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install web test dependencies
        run: npm ci
        working-directory: tests/web

      - name: Run web tests
        run: npm test
        working-directory: tests/web

      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1 -ReleaseTag $env:GITHUB_REF_NAME

      - name: Validate plugin manifest
        shell: pwsh
        run: ./scripts/test-manifest.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/*.zip artifacts/manifest.json --generate-notes --title $env:GITHUB_REF_NAME

      - name: Publish stable repository manifest
        shell: pwsh
        run: |
          $publishedManifest = Join-Path $env:RUNNER_TEMP "manifest.json"
          Copy-Item -LiteralPath artifacts/manifest.json -Destination $publishedManifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin manifest:refs/remotes/origin/manifest
          if ($LASTEXITCODE -eq 0) {
            git switch -C manifest origin/manifest
          } else {
            git switch --orphan manifest
            git rm -rf .
          }
          Copy-Item -LiteralPath $publishedManifest -Destination manifest.json
          git add manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update plugin manifest for $env:GITHUB_REF_NAME"
            git push origin manifest
          }
