name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run .NET tests
        run: dotnet test tests/Jellyfin.Plugin.CsfdBadge.Tests/Jellyfin.Plugin.CsfdBadge.Tests.csproj --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install web test dependencies
        run: npm ci
        working-directory: tests/web

      - name: Run web tests
        run: npm test
        working-directory: tests/web

      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1 -ReleaseTag $env:GITHUB_REF_NAME

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/*.zip artifacts/manifest.json --generate-notes --title $env:GITHUB_REF_NAME
